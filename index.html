<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思緒拆解與目標規劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 text-slate-800">
    <div class="max-w-3xl mx-auto">
        <!-- 頁首與匯出匯入按鈕 -->
        <header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">🧠 思緒卡片與目標拆解</h1>
                <p class="text-xs text-slate-500 mt-1">分層領域管理 · 頁籤切換 · 100% 本地零風險儲存</p>
            </div>
            <!-- 匯出與匯入功能按鈕 -->
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl border border-indigo-200 font-medium transition-colors flex items-center gap-1">
                    📥 匯出備份
                </button>
                <label class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl border border-slate-300 font-medium transition-colors cursor-pointer flex items-center gap-1">
                    📤 匯入備份
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- 新增思緒輸入區 (包含上一層領域選擇) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">💡 記錄新的思緒與目標</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">上一層領域/類別：</label>
                    <select id="categorySelect" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="❤️ 健康">❤️ 健康</option>
                        <option value="💼 事業" selected>💼 事業</option>
                        <option value="💰 理財">💰 理財</option>
                        <option value="🌱 個人成長">🌱 個人成長</option>
                        <option value="🏠 家庭">🏠 家庭</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">思緒 / 想法主題：</label>
                    <input type="text" id="thoughtInput" placeholder="例如：規畫半馬跑步訓練、理財投資組合..." 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 最終目標：</label>
                    <input type="text" id="goalInput" placeholder="例如：完成人生第一次半程馬拉松 21K" 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📅 預期達成日期：</label>
                    <input type="date" id="dateInput" 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="addThought()" 
                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-6 py-2.5 rounded-xl transition-colors shadow-sm">
                    ＋ 新增思緒目標
                </button>
            </div>
        </div>

        <!-- 分頁頁籤列 (Category Tabs) -->
        <div class="mb-6 overflow-x-auto pb-1">
            <div id="categoryTabs" class="flex gap-2 border-b border-slate-200 pb-2">
                <!-- 動態生成分類頁籤 -->
            </div>
        </div>

        <!-- 思緒卡片列表區 -->
        <div id="thoughtList" class="space-y-6"></div>
    </div>

    <script>
        // 初始化資料：預設從本地 LocalStorage 載入
        let thoughts = JSON.parse(localStorage.getItem('my_thoughts_local')) || [
            {
                id: Date.now(),
                category: "❤️ 健康",
                text: "規畫半馬跑步訓練計劃",
                goal: "順利完賽 11 月新竹半程馬拉松 (21K)",
                targetDate: "2026-11-30",
                steps: [
                    { id: 1, text: "每週安排 3 次 5K 輕鬆跑", done: true },
                    { id: 2, text: "週末安排一次 10K 長距離慢跑", done: false }
                ]
            },
            {
                id: Date.now() + 1,
                category: "💼 事業",
                text: "建立個人專案管理與目標追蹤系統",
                goal: "完成支援分頁與本地備份的 Web 應用程式發布",
                targetDate: "2026-12-31",
                steps: [
                    { id: 1, text: "設計頂層領域分頁與流暢切換 UI", done: true },
                    { id: 2, text: "發布更新至 GitHub Pages", done: false }
                ]
            }
        ];

        // 當前選取的領域頁籤
        let activeCategory = "全部";
        // 正在編輯中的思緒 ID
        let editingThoughtId = null;

        // 儲存至本地瀏覽器
        function saveData() {
            localStorage.setItem('my_thoughts_local', JSON.stringify(thoughts));
            render();
        }

        // 新增思緒與目標
        function addThought() {
            const categorySelect = document.getElementById('categorySelect');
            const input = document.getElementById('thoughtInput');
            const goalInput = document.getElementById('goalInput');
            const dateInput = document.getElementById('dateInput');

            const category = categorySelect.value;
            const text = input.value.trim();
            const goal = goalInput.value.trim();
            const targetDate = dateInput.value;

            if (!text) {
                alert("請填入思緒/想法主題！");
                return;
            }

            thoughts.push({
                id: Date.now(),
                category: category || '💼 事業',
                text: text,
                goal: goal || '未設定目標',
                targetDate: targetDate || '未指定日期',
                steps: []
            });

            input.value = '';
            goalInput.value = '';
            dateInput.value = '';
            
            // 自動切換到剛新增的分類頁籤
            activeCategory = category;
            saveData();
        }

        // 刪除思緒
        function deleteThought(thoughtId) {
            if (confirm("確定要刪除這項思緒及其所有行動拆解嗎？")) {
                thoughts = thoughts.filter(t => t.id !== thoughtId);
                if (editingThoughtId === thoughtId) editingThoughtId = null;
                saveData();
            }
        }

        // 開始編輯
        function startEdit(thoughtId) {
            editingThoughtId = thoughtId;
            render();
        }

        // 取消編輯
        function cancelEdit() {
            editingThoughtId = null;
            render();
        }

        // 儲存編輯後的思緒
        function saveEdit(thoughtId) {
            const categoryVal = document.getElementById(`edit-category-${thoughtId}`).value;
            const textVal = document.getElementById(`edit-text-${thoughtId}`).value.trim();
            const goalVal = document.getElementById(`edit-goal-${thoughtId}`).value.trim();
            const dateVal = document.getElementById(`edit-date-${thoughtId}`).value;

            if (!textVal) {
                alert("思緒主題不能為空！");
                return;
            }

            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                thought.category = categoryVal;
                thought.text = textVal;
                thought.goal = goalVal || '未設定目標';
                thought.targetDate = dateVal || '未指定日期';
                editingThoughtId = null;
                saveData();
            }
        }

        // 新增行動拆解步驟
        function addStep(thoughtId, inputId) {
            const input = document.getElementById(inputId);
            const text = input.value.trim();
            if (!text) return;

            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                thought.steps.push({
                    id: Date.now(),
                    text: text,
                    done: false
                });
                saveData();
            }
        }

        // 切換完成狀態
        function toggleStep(thoughtId, stepId) {
            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                const step = thought.steps.find(s => s.id === stepId);
                if (step) {
                    step.done = !step.done;
                    saveData();
                }
            }
        }

        // 刪除步驟
        function deleteStep(thoughtId, stepId) {
            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                thought.steps = thought.steps.filter(s => s.id !== stepId);
                saveData();
            }
        }

        // 📥 匯出 JSON
        function exportData() {
            if (thoughts.length === 0) {
                alert("目前沒有可匯出的思緒資料！");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(thoughts, null, 2));
            const downloadAnchor = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `思緒與目標備份_${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 📤 匯入 JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedThoughts = JSON.parse(e.target.result);
                    if (Array.isArray(importedThoughts)) {
                        if (confirm("匯入備份檔將會覆蓋當前畫面的資料，確定要繼續嗎？")) {
                            thoughts = importedThoughts;
                            editingThoughtId = null;
                            activeCategory = "全部";
                            saveData();
                            alert("成功匯入備份資料！");
                        }
                    } else {
                        alert("檔案格式不正確！");
                    }
                } catch (err) {
                    alert("解析備份檔案失敗，請確認是否為正確的 .json 格式檔案。");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 切換領域頁籤
        function setCategoryTab(cat) {
            activeCategory = cat;
            render();
        }

        // 渲染畫面
        function render() {
            // 1. 渲染領域分頁頁籤 (Category Tabs)
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            // 取得目前所有出現過的領域列表
            const categoriesSet = new Set(thoughts.map(t => t.category || '💼 事業'));
            const allCategories = ['全部', ...Array.from(categoriesSet)];

            allCategories.forEach(cat => {
                const count = cat === '全部' ? thoughts.length : thoughts.filter(t => (t.category || '💼 事業') === cat).length;
                const isActive = (activeCategory === cat);
                
                const btn = document.createElement('button');
                btn.onclick = () => setCategoryTab(cat);
                btn.className = `px-4 py-2 text-xs font-semibold rounded-xl whitespace-nowrap transition-all ${
                    isActive 
                    ? 'bg-indigo-600 text-white shadow-sm' 
                    : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                }`;
                btn.innerHTML = `${cat} <span class="${isActive ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500'} px-1.5 py-0.5 rounded-full text-[10px] ml-1">${count}</span>`;
                tabsContainer.appendChild(btn);
            });

            // 2. 篩選目前頁籤對應的思緒列表
            const filteredThoughts = activeCategory === '全部' 
                ? thoughts 
                : thoughts.filter(t => (t.category || '💼 事業') === activeCategory);

            const container = document.getElementById('thoughtList');
            container.innerHTML = '';

            if (filteredThoughts.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400">目前「${activeCategory}」領域尚無記錄，請在上方新增您的第一點想法！</div>`;
                return;
            }

            filteredThoughts.forEach((thought, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden";
                const isEditing = (editingThoughtId === thought.id);
                const stepInputId = `step-input-${thought.id}`;

                const stepsHtml = thought.steps.map(step => `
                    <li class="flex items-center justify-between py-1.5 px-3 bg-slate-50 rounded-lg group">
                        <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                            <input type="checkbox" ${step.done ? 'checked' : ''} 
                                onchange="toggleStep(${thought.id}, ${step.id})" 
                                class="w-4 h-4 text-indigo-600 rounded border-slate-300">
                            <span class="${step.done ? 'line-through text-slate-400' : 'text-slate-700'} text-sm">
                                ${step.text}
                            </span>
                        </label>
                        <button onclick="deleteStep(${thought.id}, ${step.id})" 
                            class="text-slate-400 hover:text-red-500 text-xs opacity-0 group-hover:opacity-100 transition-opacity">
                            刪除
                        </button>
                    </li>
                `).join('');

                if (isEditing) {
                    // ✏️ 編輯模式卡片 UI
                    card.innerHTML = `
                        <div class="p-5 bg-amber-50/40 border-b border-amber-200/60 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">✏️ 正在編輯項目 #${index + 1}</span>
                                <div class="flex gap-2">
                                    <button onclick="cancelEdit()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition-colors">取消</button>
                                    <button onclick="saveEdit(${thought.id})" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg font-medium transition-colors shadow-sm">💾 儲存修改</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">領域類別：</label>
                                    <select id="edit-category-${thought.id}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                        <option value="❤️ 健康" ${thought.category === '❤️ 健康' ? 'selected' : ''}>❤️ 健康</option>
                                        <option value="💼 事業" ${thought.category === '💼 事業' ? 'selected' : ''}>💼 事業</option>
                                        <option value="💰 理財" ${thought.category === '💰 理財' ? 'selected' : ''}>💰 理財</option>
                                        <option value="🌱 個人成長" ${thought.category === '🌱 個人成長' ? 'selected' : ''}>🌱 個人成長</option>
                                        <option value="🏠 家庭" ${thought.category === '🏠 家庭' ? 'selected' : ''}>🏠 家庭</option>
                                    </select>
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">思緒 / 想法主題：</label>
                                    <input type="text" id="edit-text-${thought.id}" value="${thought.text.replace(/"/g, '&quot;')}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 最終目標：</label>
                                    <input type="text" id="edit-goal-${thought.id}" value="${(thought.goal || '').replace(/"/g, '&quot;')}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">📅 預期達成日期：</label>
                                    <input type="date" id="edit-date-${thought.id}" value="${thought.targetDate !== '未指定日期' ? (thought.targetDate || '') : ''}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-700">
                                </div>
                            </div>
                        </div>
                        <div class="p-4 bg-slate-50/30">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">📋 行動拆解清單</h3>
                            <ul class="space-y-1.5 opacity-60">${stepsHtml || '<li class="text-xs text-slate-400 italic">尚無步驟</li>'}</ul>
                        </div>
                    `;
                } else {
                    // 👁️ 一般檢視模式卡片 UI
                    card.innerHTML = `
                        <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <div class="flex items-start gap-3">
                                    <span class="inline-flex items-center justify-center bg-indigo-100 text-indigo-700 font-bold text-sm w-7 h-7 rounded-full shrink-0 mt-0.5">
                                        ${index + 1}
                                    </span>
                                    <div>
                                        <span class="inline-block bg-slate-200/70 text-slate-700 font-semibold text-[10px] px-2 py-0.5 rounded-md mb-1">
                                            ${thought.category || '💼 事業'}
                                        </span>
                                        <h2 class="font-bold text-slate-800 text-lg leading-snug">${thought.text}</h2>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 shrink-0 pt-0.5">
                                    <button onclick="startEdit(${thought.id})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-slate-800 px-2.5 py-1 rounded-md font-medium border border-slate-200 transition-colors">
                                        ✏️ 編輯
                                    </button>
                                    <button onclick="deleteThought(${thought.id})" class="text-xs text-slate-400 hover:text-red-500 px-1 py-1">
                                        刪除
                                    </button>
                                </div>
                            </div>

                            <div class="ml-10 flex flex-wrap gap-2 text-xs">
                                <span class="inline-flex items-center gap-1 bg-amber-50 text-amber-800 border border-amber-200/60 px-2.5 py-1 rounded-md font-medium">
                                    🎯 最終目標：${thought.goal || '未設定'}
                                </span>
                                <span class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-800 border border-indigo-200/60 px-2.5 py-1 rounded-md font-medium">
                                    📅 預期日期：${thought.targetDate || '未指定'}
                                </span>
                            </div>
                        </div>

                        <div class="p-4">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">📋 行動拆解 (Next Action Steps)</h3>
                            <ul class="space-y-2 mb-4">
                                ${stepsHtml || '<li class="text-xs text-slate-400 italic">尚未新增拆解步驟...</li>'}
                            </ul>
                            <div class="flex gap-2">
                                <input type="text" id="${stepInputId}" placeholder="+ 新增這點思緒的下一步行動..." 
                                    onkeypress="if(event.key==='Enter') addStep(${thought.id}, '${stepInputId}')"
                                    class="flex-1 px-3 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <button onclick="addStep(${thought.id}, '${stepInputId}')" 
                                    class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium px-3.5 py-1.5 rounded-lg transition-colors">
                                    新增步驟
                                </button>
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        document.getElementById('thoughtInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addThought();
        });

        // 初始化繪製
        render();
    </script>
</body>
</html>
