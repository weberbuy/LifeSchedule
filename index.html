<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思緒拆解與目標規劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 text-slate-800">
    <div class="max-w-3xl mx-auto">
        <!-- 頁首與匯出匯入按鈕 -->
        <header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">🧠 思緒卡片與目標拆解</h1>
                <p class="text-xs text-slate-500 mt-1">分層領域管理 · 頁籤切換 · 100% 本地零風險儲存</p>
            </div>
            <!-- 匯出與匯入功能按鈕 -->
            <div class="flex items-center gap-2">
                <button onclick="window.exportData()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl border border-indigo-200 font-medium transition-colors flex items-center gap-1">
                    📥 匯出備份
                </button>
                <label class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl border border-slate-300 font-medium transition-colors cursor-pointer flex items-center gap-1">
                    📤 匯入備份
                    <input type="file" id="importFile" accept=".json" onchange="window.importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- 新增思緒輸入區 (原生下拉選單 + 自訂欄位) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">💡 記錄新的思緒與目標</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">上一層領域/類別：</label>
                    <select id="categorySelect" onchange="window.handleCategoryChange()" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-700">
                        <option value="❤️ 健康">❤️ 健康</option>
                        <option value="💼 事業" selected>💼 事業</option>
                        <option value="💰 理財">💰 理財</option>
                        <option value="🌱 個人成長">🌱 個人成長</option>
                        <option value="🏠 家庭">🏠 家庭</option>
                        <option value="__custom__">✍️ + 輸入自訂領域...</option>
                    </select>
                    <!-- 選取自訂時顯示的輸入框 -->
                    <input type="text" id="customCategoryInput" placeholder="輸入領域名稱 (如：✈️ 旅遊)" 
                        class="hidden w-full px-3.5 py-2 mt-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">思緒 / 想法主題：</label>
                    <input type="text" id="thoughtInput" placeholder="例如：規畫半馬跑步訓練、理財投資組合..." 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 最終目標：</label>
                    <input type="text" id="goalInput" placeholder="例如：完成人生第一次半程馬拉松 21K" 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📅 預期達成日期：</label>
                    <input type="date" id="dateInput" 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="window.addThought()" 
                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-6 py-2.5 rounded-xl transition-colors shadow-sm">
                    ＋ 新增思緒目標
                </button>
            </div>
        </div>

        <!-- 分頁頁籤列 (Category Tabs) -->
        <div class="mb-6 overflow-x-auto pb-1">
            <div id="categoryTabs" class="flex gap-2 border-b border-slate-200 pb-2">
                <!-- 動態生成分類頁籤 -->
            </div>
        </div>

        <!-- 思緒卡片列表區 -->
        <div id="thoughtList" class="space-y-6"></div>
    </div>

    <script>

            // 初始化資料：預設從本地 LocalStorage 載入

                thoughts = [];

                        ]
                    }
                ];
            }

                        customInput.classList.remove('hidden');
                        customInput.focus();
                    } else {
                        customInput.classList.add('hidden');
                    }
                }
            };
