<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思緒拆解與時間軸目標規劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 text-slate-800">
    <div class="max-w-4xl mx-auto">
        <!-- 頁首與備份按鈕 -->
        <header class="mb-4 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">🧠 思緒卡片與目標拆解</h1>
                <p class="text-xs text-slate-500 mt-1">100% 本地儲存 · 三視角切換 · 跨領域時間對照矩陣</p>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl border border-indigo-200 font-medium transition-colors">📥 備份</button>
                <label class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl border border-slate-300 font-medium transition-colors cursor-pointer">
                    📤 匯入
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- 三模式切換列 (Cards vs Overview vs Timeline Matrix) -->
        <div class="mb-6 bg-slate-200/80 p-1.5 rounded-2xl flex items-center shadow-inner border border-slate-300/60 gap-1 overflow-x-auto">
            <button onclick="setViewMode('overview')" id="btnViewOverview" class="flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-md whitespace-nowrap">
                🎯 總覽模式 (整體思考)
            </button>
            <button onclick="setViewMode('cards')" id="btnViewCards" class="flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900 whitespace-nowrap">
                🎴 看板模式 (完整卡片)
            </button>
            <button onclick="setViewMode('timeline')" id="btnViewTimeline" class="flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900 whitespace-nowrap">
                ⏳ 時間軸模式 (跨領域對照矩陣)
            </button>
        </div>

        <!-- 表單輸入區 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">💡 記錄新的思緒與目標</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">上一層領域/類別：</label>
                    <input type="text" id="categoryInput" value="💼 事業" placeholder="輸入或點選標籤" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div class="flex flex-wrap gap-1 mt-1.5">
                        <button type="button" onclick="setCategory('❤️ 健康')" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">❤️ 健康</button>
                        <button type="button" onclick="setCategory('💼 事業')" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">💼 事業</button>
                        <button type="button" onclick="setCategory('💰 理財')" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">💰 理財</button>
                        <button type="button" onclick="setCategory('🌱 個人成長')" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">🌱 個人成長</button>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">思緒 / 想法主題：</label>
                    <input type="text" id="thoughtInput" placeholder="例如：規畫半馬跑步訓練..." class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 最終目標：</label>
                    <input type="text" id="goalInput" placeholder="例如：完成人生第一次半程馬拉松 21K" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📅 預期達成日期：</label>
                    <input type="date" id="dateInput" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
                </div>
            </div>

            <div class="flex justify-end pt-1">
                <button onclick="addThought()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-6 py-2.5 rounded-xl transition-colors shadow-sm">＋ 新增思緒目標</button>
            </div>
        </div>

        <!-- 頁籤列與排序控制 (僅看板模式顯示) -->
        <div id="tabsSection" class="mb-6 hidden">
            <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-bold text-slate-500">📂 領域分頁切換：</span>
                <button onclick="toggleReorderMode()" id="reorderBtn" class="text-[11px] text-slate-600 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg border border-slate-300 transition-colors">
                    ⚙️ 調整頁籤順序
                </button>
            </div>
            <div class="overflow-x-auto pb-1">
                <div id="categoryTabs" class="flex gap-2 border-b border-slate-200 pb-2"></div>
            </div>
        </div>

        <!-- 主顯示區塊 (總覽、看板或跨領域時間矩陣) -->
        <div id="mainContentList" class="space-y-6"></div>
    </div>

    <script>
        let thoughts = [];
        try { thoughts = JSON.parse(localStorage.getItem('my_thoughts_local')) || []; } catch(e) { thoughts = []; }
        if (!Array.isArray(thoughts) || thoughts.length === 0) {
            thoughts = [
                { id: Date.now(), category: "❤️ 健康", text: "規畫半馬跑步訓練計劃", goal: "順利完賽 11 月半程馬拉松", targetDate: "2026-11-30", steps: [{ id: 1, text: "每週安排 3 次 5K 輕鬆跑", stepDate: "2026-08-10", stepTime: "30分鐘", done: true }] },
                { id: Date.now() + 1, category: "💼 事業", text: "建立個人專案管理系統", goal: "發布支援跨領域時間矩陣的 App", targetDate: "2026-12-31", steps: [{ id: 1, text: "設計 X 軸領域對照矩陣", stepDate: "2026-08-08", stepTime: "2小時", done: true }] }
            ];
        }

        let categoryOrder = [];
        try { categoryOrder = JSON.parse(localStorage.getItem('my_category_order')) || []; } catch(e) { categoryOrder = []; }

        let activeCategory = "全部";
        let viewMode = "overview"; // 'overview' | 'cards' | 'timeline'
        let editingId = null;
        let editingStepIdKey = null;
        let isReorderMode = false;

        function setCategory(cat) {
            document.getElementById('categoryInput').value = cat;
        }

        function setViewMode(mode) {
            viewMode = mode;
            const btnOverview = document.getElementById('btnViewOverview');
            const btnCards = document.getElementById('btnViewCards');
            const btnTimeline = document.getElementById('btnViewTimeline');
            const tabsSection = document.getElementById('tabsSection');

            const activeClass = "flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-md whitespace-nowrap";
            const inactiveClass = "flex-1 py-2 px-3 text-xs sm:text-sm font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900 whitespace-nowrap";

            btnOverview.className = (mode === 'overview') ? activeClass : inactiveClass;
            btnCards.className = (mode === 'cards') ? activeClass : inactiveClass;
            btnTimeline.className = (mode === 'timeline') ? activeClass : inactiveClass;

            if (tabsSection) {
                if (mode === 'cards') tabsSection.classList.remove('hidden');
                else tabsSection.classList.add('hidden');
            }
            render();
        }

        function toggleReorderMode() {
            isReorderMode = !isReorderMode;
            const btn = document.getElementById('reorderBtn');
            if (btn) {
                btn.innerText = isReorderMode ? "✅ 完成排序" : "⚙️ 調整頁籤順序";
                btn.className = isReorderMode 
                    ? "text-[11px] text-white bg-emerald-600 hover:bg-emerald-700 px-2.5 py-1 rounded-lg transition-colors font-medium shadow-sm"
                    : "text-[11px] text-slate-600 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg border border-slate-300 transition-colors";
            }
            render();
        }

        function saveData() {
            localStorage.setItem('my_thoughts_local', JSON.stringify(thoughts));
            render();
        }

        function saveCategoryOrder() {
            localStorage.setItem('my_category_order', JSON.stringify(categoryOrder));
            render();
        }

        function moveCategoryLeft(cat, ev) {
            if (ev) ev.stopPropagation();
            const idx = categoryOrder.indexOf(cat);
            if (idx > 0) {
                const temp = categoryOrder[idx];
                categoryOrder[idx] = categoryOrder[idx - 1];
                categoryOrder[idx - 1] = temp;
                saveCategoryOrder();
            }
        }

        function moveCategoryRight(cat, ev) {
            if (ev) ev.stopPropagation();
            const idx = categoryOrder.indexOf(cat);
            if (idx !== -1 && idx < categoryOrder.length - 1) {
                const temp = categoryOrder[idx];
                categoryOrder[idx] = categoryOrder[idx + 1];
                categoryOrder[idx + 1] = temp;
                saveCategoryOrder();
            }
        }

        function addThought() {
            const cat = document.getElementById('categoryInput').value.trim() || '💼 事業';
            const text = document.getElementById('thoughtInput').value.trim();
            const goal = document.getElementById('goalInput').value.trim();
            const date = document.getElementById('dateInput').value;

            if (!text) return alert("請填入思緒/想法主題！");

            thoughts.push({
                id: Date.now(),
                category: cat,
                text: text,
                goal: goal || '未設定目標',
                targetDate: date || '未指定日期',
                steps: []
            });

            document.getElementById('thoughtInput').value = '';
            document.getElementById('goalInput').value = '';
            document.getElementById('dateInput').value = '';
            activeCategory = cat;
            saveData();
        }

        function deleteThought(id) {
            if (confirm("確定刪除這項思緒？")) {
                thoughts = thoughts.filter(t => t.id !== id);
                if (editingId === id) editingId = null;
                saveData();
            }
        }

        function startEdit(id) { editingId = id; render(); }
        function cancelEdit() { editingId = null; render(); }

        function saveEdit(id) {
            const cat = document.getElementById(`edit-cat-${id}`).value.trim();
            const text = document.getElementById(`edit-text-${id}`).value.trim();
            const goal = document.getElementById(`edit-goal-${id}`).value.trim();
            const date = document.getElementById(`edit-date-${id}`).value;

            if (!text) return alert("思緒主題不能為空！");

            const t = thoughts.find(x => x.id === id);
            if (t) {
                t.category = cat || '💼 事業';
                t.text = text;
                t.goal = goal || '未設定目標';
                t.targetDate = date || '未指定日期';
                editingId = null;
                saveData();
            }
        }

        function addStep(thoughtId) {
            const textInput = document.getElementById(`step-text-${thoughtId}`);
            const dateInput = document.getElementById(`step-date-${thoughtId}`);
            const timeInput = document.getElementById(`step-time-${thoughtId}`);

            const text = textInput ? textInput.value.trim() : '';
            const stepDate = dateInput ? dateInput.value : '';
            const stepTime = timeInput ? timeInput.value.trim() : '';

            if (!text) return alert("請填入步驟內容！");

            const t = thoughts.find(x => x.id === thoughtId);
            if (t) {
                if (stepDate && t.targetDate && t.targetDate !== '未指定日期') {
                    if (stepDate > t.targetDate) {
                        return alert(`步驟預期日期 (${stepDate}) 不能超過最終目標預期日期 (${t.targetDate})！`);
                    }
                }

                t.steps.push({
                    id: Date.now(),
                    text: text,
                    stepDate: stepDate || '',
                    stepTime: stepTime || '',
                    done: false
                });
                textInput.value = '';
                if (dateInput) dateInput.value = '';
                if (timeInput) timeInput.value = '';
                saveData();
            }
        }

        function toggleStep(thoughtId, stepId) {
            const t = thoughts.find(x => x.id === thoughtId);
            if (t) {
                const s = t.steps.find(x => x.id === stepId);
                if (s) { s.done = !s.done; saveData(); }
            }
        }

        function deleteStep(thoughtId, stepId) {
            const t = thoughts.find(x => x.id === thoughtId);
            if (t) {
                t.steps = t.steps.filter(x => x.id !== stepId);
                saveData();
            }
        }

        function startEditStep(thoughtId, stepId) {
            editingStepIdKey = `${thoughtId}-${stepId}`;
            render();
        }

        function cancelEditStep() {
            editingStepIdKey = null;
            render();
        }

        function saveEditStep(thoughtId, stepId) {
            const textInput = document.getElementById(`edit-step-text-${thoughtId}-${stepId}`);
            const dateInput = document.getElementById(`edit-step-date-${thoughtId}-${stepId}`);
            const timeInput = document.getElementById(`edit-step-time-${thoughtId}-${stepId}`);

            const text = textInput ? textInput.value.trim() : '';
            const stepDate = dateInput ? dateInput.value : '';
            const stepTime = timeInput ? timeInput.value.trim() : '';

            if (!text) return alert("步驟內容不能為空！");

            const t = thoughts.find(x => x.id === thoughtId);
            if (t) {
                if (stepDate && t.targetDate && t.targetDate !== '未指定日期') {
                    if (stepDate > t.targetDate) {
                        return alert(`步驟預期日期 (${stepDate}) 不能超過最終目標預期日期 (${t.targetDate})！`);
                    }
                }

                const s = t.steps.find(x => x.id === stepId);
                if (s) {
                    s.text = text;
                    s.stepDate = stepDate;
                    s.stepTime = stepTime;
                    editingStepIdKey = null;
                    saveData();
                }
            }
        }

        function exportData() {
            if (thoughts.length === 0) return alert("目前沒有可匯出的思緒資料！");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(thoughts, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `思緒與目標備份_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (Array.isArray(data) && confirm("確定匯入並覆蓋當前資料？")) {
                        thoughts = data;
                        editingId = null;
                        editingStepIdKey = null;
                        activeCategory = "全部";
                        saveData();
                        alert("成功匯入備份資料！");
                    }
                } catch(err) { alert("備份檔案格式不正確。"); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function setCategoryTab(cat) { activeCategory = cat; render(); }

        function render() {
            const container = document.getElementById('mainContentList');
            container.innerHTML = '';

            if (viewMode === 'overview') {
                renderOverview(container);
            } else if (viewMode === 'timeline') {
                renderTimelineMatrix(container);
            } else {
                renderCards(container);
            }
        }

        // ⏳ 渲染 X 軸跨領域時間矩陣 (Matrix Timeline View)
        function renderTimelineMatrix(container) {
            const datesSet = new Set();
            const categoriesSet = new Set();

            thoughts.forEach(t => {
                const cat = t.category || '💼 事業';
                categoriesSet.add(cat);
                if (t.targetDate && t.targetDate !== '未指定日期') datesSet.add(t.targetDate);
                if (Array.isArray(t.steps)) {
                    t.steps.forEach(s => { if (s.stepDate) datesSet.add(s.stepDate); });
                }
            });

            const sortedDates = Array.from(datesSet).sort();
            const categoriesList = Array.from(categoriesSet);

            if (sortedDates.length === 0 || categoriesList.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200">目前尚無設定預期日期的目標或步驟！請在思緒卡片中加上預期日期即可在時間軸呈現。</div>`;
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 overflow-x-auto";

            let html = `
                <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                    <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                        <span>⏳ 跨領域時間對照矩陣 (X軸: 領域類別 | Y軸: 先後日期)</span>
                    </h2>
                </div>

                <table class="w-full border-collapse text-xs border border-slate-200">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 font-bold">
                            <th class="p-3 text-left border border-slate-200 w-32 bg-slate-200/60 shrink-0">📅 日期 (Y軸)</th>
                            ${categoriesList.map(c => `<th class="p-3 text-left border border-slate-200 bg-indigo-50 text-indigo-900 min-w-[180px]">${c}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;

            sortedDates.forEach(date => {
                html += `<tr class="hover:bg-slate-50/50">`;
                html += `<td class="p-3 border border-slate-200 font-bold text-slate-800 bg-slate-50/60 align-top">${date}</td>`;

                categoriesList.forEach(cat => {
                    html += `<td class="p-2.5 border border-slate-200 align-top space-y-2 bg-white">`;

                    const matchingGoals = thoughts.filter(t => (t.category || '💼 事業') === cat && t.targetDate === date);
                    matchingGoals.forEach(g => {
                        html += `
                            <div class="p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 shadow-sm">
                                <div class="font-bold text-[11px] text-amber-800">🎯 最終目標</div>
                                <div class="font-bold text-xs mt-0.5">${g.goal || g.text}</div>
                                <div class="text-[10px] text-amber-700/80 mt-1">主題: ${g.text}</div>
                            </div>
                        `;
                    });

                    thoughts.filter(t => (t.category || '💼 事業') === cat).forEach(t => {
                        if (Array.isArray(t.steps)) {
                            t.steps.filter(s => s.stepDate === date).forEach(s => {
                                html += `
                                    <div class="p-2 rounded-lg bg-slate-50 border border-slate-200 text-slate-800 shadow-sm">
                                        <label class="flex items-start gap-1.5 cursor-pointer">
                                            <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleStep(${t.id}, ${s.id})" class="mt-0.5 w-3.5 h-3.5 text-indigo-600 rounded border-slate-300">
                                            <span class="${s.done ? 'line-through text-slate-400' : 'font-medium'} text-xs">${s.text}</span>
                                        </label>
                                        ${s.stepTime ? `<div class="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-100 inline-block mt-1 font-semibold">⏰ ${s.stepTime}</div>` : ''}
                                        <div class="text-[10px] text-slate-400 mt-1">歸屬: ${t.text}</div>
                                    </div>
                                `;
                            });
                        }
                    });

                    html += `</td>`;
                });

                html += `</tr>`;
            });

            html += `
                    </tbody>
                </table>
            `;

            wrapper.innerHTML = html;
            container.appendChild(wrapper);
        }

        // 🎯 渲染高階總覽模式 (Overview View)
        function renderOverview(container) {
            if (thoughts.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200">目前尚無記錄！</div>`;
                return;
            }

            const grouped = {};
            thoughts.forEach(t => {
                const cat = t.category || '💼 事業';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(t);
            });

            const categories = Object.keys(grouped);

            categories.forEach(cat => {
                const catBox = document.createElement('div');
                const cardList = grouped[cat];
                catBox.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6";

                let html = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                            <span>${cat}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">${cardList.length} 個目標</span>
                        </h2>
                    </div>
                    <div class="space-y-3">
                `;

                cardList.forEach((t, i) => {
                    const doneCount = t.steps.filter(s => s.done).length;
                    const totalCount = t.steps.length;
                    const percent = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

                    html += `
                        <div class="bg-slate-50/80 p-4 rounded-xl border border-slate-200/80 hover:border-indigo-200 transition-colors">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
                                <div class="flex items-start gap-2.5">
                                    <span class="inline-flex items-center justify-center bg-indigo-100 text-indigo-700 font-bold text-xs w-6 h-6 rounded-full shrink-0 mt-0.5">${i + 1}</span>
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-base leading-snug">${t.text}</h3>
                                        <div class="text-xs text-amber-800 font-medium mt-1">🎯 最終目標：${t.goal || '未設定'}</div>
                                    </div>
                                </div>
                                <div class="text-xs font-bold text-slate-600 bg-white border border-slate-200 px-3 py-1.5 rounded-lg shrink-0 flex items-center justify-between sm:justify-end gap-2">
                                    <span>📅 ${t.targetDate || '未指定'}</span>
                                    <span class="text-indigo-600 font-bold">進度: ${doneCount}/${totalCount} (${percent}%)</span>
                                </div>
                            </div>
                            <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mt-3">
                                <div class="bg-indigo-600 h-full transition-all duration-300" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                catBox.innerHTML = html;
                container.appendChild(catBox);
            });
        }

        // 🎴 渲染看板模式 (Cards View)
        function renderCards(container) {
            const currentCats = Array.from(new Set(thoughts.map(t => t.category || '💼 事業')));
            currentCats.forEach(c => { if (!categoryOrder.includes(c)) categoryOrder.push(c); });
            categoryOrder = categoryOrder.filter(c => currentCats.includes(c));

            const tabsContainer = document.getElementById('categoryTabs');
            if (tabsContainer) {
                tabsContainer.innerHTML = '';
                const displayCategories = ['全部', ...categoryOrder];
                if (!displayCategories.includes(activeCategory)) activeCategory = '全部';

                displayCategories.forEach((cat) => {
                    const count = cat === '全部' ? thoughts.length : thoughts.filter(t => (t.category || '💼 事業') === cat).length;
                    const isActive = (activeCategory === cat);
                    
                    const btn = document.createElement('button');
                    btn.onclick = () => setCategoryTab(cat);
                    btn.className = `px-3.5 py-1.5 text-xs font-semibold rounded-xl whitespace-nowrap transition-all flex items-center gap-1.5 ${
                        isActive ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                    }`;

                    let arrowsHtml = '';
                    if (isReorderMode && cat !== '全部') {
                        arrowsHtml = `
                            <span class="inline-flex gap-1 ml-1 pl-1 border-l ${isActive ? 'border-indigo-400' : 'border-slate-300'}">
                                <span onclick="moveCategoryLeft('${cat}', event)" class="hover:bg-black/20 rounded px-1 cursor-pointer">‹</span>
                                <span onclick="moveCategoryRight('${cat}', event)" class="hover:bg-black/20 rounded px-1 cursor-pointer">›</span>
                            </span>
                        `;
                    }

                    btn.innerHTML = `${cat} <span class="${isActive ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500'} px-1.5 py-0.5 rounded-full text-[10px]">${count}</span>${arrowsHtml}`;
                    tabsContainer.appendChild(btn);
                });
            }

            const filtered = activeCategory === '全部' ? thoughts : thoughts.filter(t => (t.category || '💼 事業') === activeCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200">目前「${activeCategory}」領域尚無記錄！</div>`;
                return;
            }

            filtered.forEach((thought, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden";
                const isEdit = (editingId === thought.id);
                const maxDateAttr = (thought.targetDate && thought.targetDate !== '未指定日期') ? `max="${thought.targetDate}"` : '';

                const stepsHtml = thought.steps.map(s => {
                    const isEditingThisStep = (editingStepIdKey === `${thought.id}-${s.id}`);
                    
                    if (isEditingThisStep) {
                        return `
                            <li class="p-2.5 bg-amber-50/60 rounded-xl border border-amber-200 space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-[11px] font-bold text-amber-800">✏️ 編輯步驟</span>
                                    <div class="flex gap-1">
                                        <button onclick="cancelEditStep()" class="text-[10px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-1 rounded">取消</button>
                                        <button onclick="saveEditStep(${thought.id}, ${s.id})" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded shadow-sm">💾 儲存</button>
                                    </div>
                                </div>
                                <input type="text" id="edit-step-text-${thought.id}-${s.id}" value="${s.text.replace(/"/g, '&quot;')}" class="w-full px-2.5 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="date" id="edit-step-date-${thought.id}-${s.id}" value="${s.stepDate || ''}" ${maxDateAttr} class="px-2 py-1 text-xs border border-slate-300 rounded text-slate-700">
                                    <input type="text" id="edit-step-time-${thought.id}-${s.id}" value="${(s.stepTime || '').replace(/"/g, '&quot;')}" placeholder="工時(如2小時)" class="px-2 py-1 text-xs border border-slate-300 rounded">
                                </div>
                            </li>
                        `;
                    } else {
                        return `
                            <li class="flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 bg-slate-50 rounded-xl gap-2">
                                <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                                    <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleStep(${thought.id}, ${s.id})" class="w-4 h-4 text-indigo-600 rounded border-slate-300">
                                    <span class="${s.done ? 'line-through text-slate-400' : 'text-slate-700'} text-sm font-medium">${s.text}</span>
                                </label>
                                <div class="flex items-center gap-1.5 text-[11px] ml-6 sm:ml-0">
                                    ${s.stepDate ? `<span class="bg-indigo-50 text-indigo-700 border border-indigo-100 px-2 py-0.5 rounded-md font-medium">📅 ${s.stepDate}</span>` : ''}
                                    ${s.stepTime ? `<span class="bg-amber-50 text-amber-700 border border-amber-100 px-2 py-0.5 rounded-md font-medium">⏰ ${s.stepTime}</span>` : ''}
                                    <button onclick="startEditStep(${thought.id}, ${s.id})" class="bg-slate-200/80 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded-md font-medium transition-colors ml-1">✏️ 編輯</button>
                                    <button onclick="deleteStep(${thought.id}, ${s.id})" class="text-slate-400 hover:text-red-500 px-1 py-0.5">🗑️ 刪除</button>
                                </div>
                            </li>
                        `;
                    }
                }).join('');

                if (isEdit) {
                    card.innerHTML = `
                        <div class="p-5 bg-amber-50/40 border-b border-amber-200/60 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full">✏️ 正在編輯 #${index + 1}</span>
                                <div class="flex gap-2">
                                    <button onclick="cancelEdit()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-medium">取消</button>
                                    <button onclick="saveEdit(${thought.id})" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-1.5 rounded-lg font-medium shadow-sm">💾 儲存修改</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">領域類別：</label>
                                    <input type="text" id="edit-cat-${thought.id}" value="${(thought.category || '💼 事業').replace(/"/g, '&quot;')}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg bg-white">
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">思緒 / 想法主題：</label>
                                    <input type="text" id="edit-text-${thought.id}" value="${thought.text.replace(/"/g, '&quot;')}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 最終目標：</label>
                                    <input type="text" id="edit-goal-${thought.id}" value="${(thought.goal || '').replace(/"/g, '&quot;')}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">📅 預期達成日期：</label>
                                    <input type="date" id="edit-date-${thought.id}" value="${thought.targetDate !== '未指定日期' ? (thought.targetDate || '') : ''}" class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg">
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                            <div class="flex items-start justify-between gap-3 mb-2">
                                <div class="flex items-start gap-3">
                                    <span class="inline-flex items-center justify-center bg-indigo-100 text-indigo-700 font-bold text-sm w-7 h-7 rounded-full shrink-0 mt-0.5">${index + 1}</span>
                                    <div>
                                        <span class="inline-block bg-slate-200/80 text-slate-700 font-semibold text-[10px] px-2 py-0.5 rounded-md mb-1">${thought.category || '💼 事業'}</span>
                                        <h2 class="font-bold text-slate-800 text-lg leading-snug">${thought.text}</h2>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 shrink-0 pt-0.5">
                                    <button onclick="startEdit(${thought.id})" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-md font-medium border border-slate-200">✏️ 編輯卡片</button>
                                    <button onclick="deleteThought(${thought.id})" class="text-xs text-slate-400 hover:text-red-500 px-1 py-1">刪除</button>
                                </div>
                            </div>
                            <div class="ml-10 flex flex-wrap gap-2 text-xs">
                                <span class="inline-flex items-center gap-1 bg-amber-50 text-amber-800 border border-amber-200/60 px-2.5 py-1 rounded-md font-medium">🎯 最終目標：${thought.goal || '未設定'}</span>
                                <span class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-800 border border-indigo-200/60 px-2.5 py-1 rounded-md font-medium">📅 預期日期：${thought.targetDate || '未指定'}</span>
                            </div>
                        </div>

                        <div class="p-4">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">📋 行動拆解步驟與時程</h3>
                            <ul class="space-y-2 mb-4">${stepsHtml || '<li class="text-xs text-slate-400 italic">尚未新增拆解步驟...</li>'}</ul>
                            
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200/80 space-y-2">
                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                    <input type="text" id="step-text-${thought.id}" placeholder="+ 新增步驟內容..." class="sm:col-span-3 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <input type="date" id="step-date-${thought.id}" ${maxDateAttr} class="px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <input type="text" id="step-time-${thought.id}" placeholder="預估工時 (如: 2小時或14:00)" class="px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <button onclick="addStep(${thought.id})" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition-colors">＋ 新增步驟</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                container.appendChild(card);
            });
        }

        document.getElementById('thoughtInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addThought();
        });

        render();
    </script>
</body>
</html>
