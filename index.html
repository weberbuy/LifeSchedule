<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思緒拆解與目標規劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 text-slate-800">
    <div class="max-w-3xl mx-auto">
        <!-- 頁首與匯出匯入按鈕 -->
        <header class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">🧠 思緒卡片與目標拆解</h1>
                <p class="text-xs text-slate-500 mt-1">分層領域管理 · 頁籤切換 · 100% 本地零風險儲存</p>
            </div>
            <!-- 匯出與匯入功能按鈕 -->
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-xl border border-indigo-200 font-medium transition-colors flex items-center gap-1">
                    📥 匯出備份
                </button>
                <label class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl border border-slate-300 font-medium transition-colors cursor-pointer flex items-center gap-1">
                    📤 匯入備份
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </header>

        <!-- 新增思緒輸入區 (原生下拉選單 + 自訂欄位) -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 space-y-4">
            <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">💡 記錄新的思緒與目標</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">上一層領域/類別：</label>
                    <select id="categorySelect" onchange="handleCategoryChange()" class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-700">
                        <option value="❤️ 健康">❤️ 健康</option>
                        <option value="💼 事業" selected>💼 事業</option>
                        <option value="💰 理財">💰 理財</option>
                        <option value="🌱 個人成長">🌱 個人成長</option>
                        <option value="🏠 家庭">🏠 家庭</option>
                        <option value="__custom__">✍️ + 輸入自訂領域...</option>
                    </select>
                    <!-- 選取自訂時顯示的輸入框 -->
                    <input type="text" id="customCategoryInput" placeholder="輸入領域名稱 (如：✈️ 旅遊)" 
                        class="hidden w-full px-3.5 py-2 mt-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">思緒 / 想法主題：</label>
                    <input type="text" id="thoughtInput" placeholder="例如：規畫半馬跑步訓練、理財投資組合..." 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 最終目標：</label>
                    <input type="text" id="goalInput" placeholder="例如：完成人生第一次半程馬拉松 21K" 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📅 預期達成日期：</label>
                    <input type="date" id="dateInput" 
                        class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700">
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="addThought()" 
                    class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-6 py-2.5 rounded-xl transition-colors shadow-sm">
                    ＋ 新增思緒目標
                </button>
            </div>
        </div>

        <!-- 分頁頁籤列 (Category Tabs) -->
        <div class="mb-6 overflow-x-auto pb-1">
            <div id="categoryTabs" class="flex gap-2 border-b border-slate-200 pb-2">
                <!-- 動態生成分類頁籤 -->
            </div>
        </div>

        <!-- 思緒卡片列表區 -->
        <div id="thoughtList" class="space-y-6"></div>
    </div>

    <script>
        // 初始化資料：預設從本地 LocalStorage 載入
        let thoughts = JSON.parse(localStorage.getItem('my_thoughts_local')) || [
            {
                id: Date.now(),
                category: "❤️ 健康",
                text: "規畫半馬跑步訓練計劃",
                goal: "順利完賽 11 月新竹半程馬拉松 (21K)",
                targetDate: "2026-11-30",
                steps: [
                    { id: 1, text: "每週安排 3 次 5K 輕鬆跑", done: true },
                    { id: 2, text: "週末安排一次 10K 長距離慢跑", done: false }
                ]
            },
            {
                id: Date.now() + 1,
                category: "💼 事業",
                text: "建立個人專案管理與目標追蹤系統",
                goal: "完成支援分頁與本地備份的 Web 應用程式發布",
                targetDate: "2026-12-31",
                steps: [
                    { id: 1, text: "設計頂層領域分頁與流暢切換 UI", done: true },
                    { id: 2, text: "發布更新至 GitHub Pages", done: false }
                ]
            }
        ];

        // 當前選取的領域頁籤
        let activeCategory = "全部";
        // 正在編輯中的思緒 ID
        let editingThoughtId = null;

        // 切換選單控制輸入框顯示
        function handleCategoryChange() {
            const select = document.getElementById('categorySelect');
            const customInput = document.getElementById('customCategoryInput');
            if (select.value === '__custom__') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
            }
        }

        // 取得選擇的領域
        function getSelectedCategory() {
            const select = document.getElementById('categorySelect');
            const customInput = document.getElementById('customCategoryInput');
            if (select.value === '__custom__') {
                return customInput.value.trim() || '💼 事業';
            }
            return select.value;
        }

        // 儲存至本地瀏覽器
        function saveData() {
            localStorage.setItem('my_thoughts_local', JSON.stringify(thoughts));
            render();
        }

        // 新增思緒與目標
        function addThought() {
            const category = getSelectedCategory();
            const input = document.getElementById('thoughtInput');
            const goalInput = document.getElementById('goalInput');
            const dateInput = document.getElementById('dateInput');

            const text = input.value.trim();
            const goal = goalInput.value.trim();
            const targetDate = dateInput.value;

            if (!text) {
                alert("請填入思緒/想法主題！");
                return;
            }

            thoughts.push({
                id: Date.now(),
                category: category,
                text: text,
                goal: goal || '未設定目標',
                targetDate: targetDate || '未指定日期',
                steps: []
            });

            input.value = '';
            goalInput.value = '';
            dateInput.value = '';
            
            // 重置下拉選單
            document.getElementById('categorySelect').value = '💼 事業';
            document.getElementById('customCategoryInput').classList.add('hidden');
            document.getElementById('customCategoryInput').value = '';

            // 自動切換到剛新增的分類頁籤
            activeCategory = category;
            saveData();
        }

        // 刪除思緒
        function deleteThought(thoughtId) {
            if (confirm("確定要刪除這項思緒及其所有行動拆解嗎？")) {
                thoughts = thoughts.filter(t => t.id !== thoughtId);
                if (editingThoughtId === thoughtId) editingThoughtId = null;
                saveData();
            }
        }

        // 開始編輯
        function startEdit(thoughtId) {
            editingThoughtId = thoughtId;
            render();
        }

        // 取消編輯
        function cancelEdit() {
            editingThoughtId = null;
            render();
        }

        // 切換編輯模式的選單
        function handleEditCategoryChange(thoughtId) {
            const select = document.getElementById(`edit-category-select-${thoughtId}`);
            const customInput = document.getElementById(`edit-category-custom-${thoughtId}`);
            if (select.value === '__custom__') {
                customInput.classList.remove('hidden');
                customInput.focus();
            } else {
                customInput.classList.add('hidden');
            }
        }

        // 儲存編輯後的思緒
        function saveEdit(thoughtId) {
            const select = document.getElementById(`edit-category-select-${thoughtId}`);
            const customInput = document.getElementById(`edit-category-custom-${thoughtId}`);
            let categoryVal = select.value === '__custom__' ? customInput.value.trim() : select.value;

            const textVal = document.getElementById(`edit-text-${thoughtId}`).value.trim();
            const goalVal = document.getElementById(`edit-goal-${thoughtId}`).value.trim();
            const dateVal = document.getElementById(`edit-date-${thoughtId}`).value;

            if (!textVal) {
                alert("思緒主題不能為空！");
                return;
            }

            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                thought.category = categoryVal || '💼 事業';
                thought.text = textVal;
                thought.goal = goalVal || '未設定目標';
                thought.targetDate = dateVal || '未指定日期';
                editingThoughtId = null;
                saveData();
            }
        }

        // 新增行動拆解步驟
        function addStep(thoughtId, inputId) {
            const input = document.getElementById(inputId);
            const text = input.value.trim();
            if (!text) return;

            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                thought.steps.push({
                    id: Date.now(),
                    text: text,
                    done: false
                });
                saveData();
            }
        }

        // 切換完成狀態
        function toggleStep(thoughtId, stepId) {
            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                const step = thought.steps.find(s => s.id === stepId);
                if (step) {
                    step.done = !step.done;
                    saveData();
                }
            }
        }

        // 刪除步驟
        function deleteStep(thoughtId, stepId) {
            const thought = thoughts.find(t => t.id === thoughtId);
            if (thought) {
                thought.steps = thought.steps.filter(s => s.id !== stepId);
                saveData();
            }
        }

        // 📥 匯出 JSON
        function exportData() {
            if (thoughts.length === 0) {
                alert("目前沒有可匯出的思緒資料！");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(thoughts,
